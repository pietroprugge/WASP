transit:
  t0: 0.0 # time of inferior conjunction
  per: 4.055259 # orbital period in days
  rp: 0.1999 # planet radius (in units of stellar radii)
  a: 11.056 # semi-major axis (in units of stellar radii)
  inc: 87.73 # orbital inclination (in degrees)
  ecc: 0.0 # eccentricity
  w: 90.0 # longitude of periastron (in degrees)
  u: [0.693, 0.110] # limb darkening coefficients [u1, u2]
  limb_dark: "quadratic" # limb darkening model
classifier:
  path: "data/tess_data.csv"
  n_bins: 1000
  samples_per_class: 350
  use_scaler: false
  random_state: 42
  rf:
    n_estimators: 500
    max_depth: null          
    min_samples_leaf: 1
    max_features: "sqrt"
    bootstrap: true
    class_weight: null
    n_jobs: -1
    oob_score: true

