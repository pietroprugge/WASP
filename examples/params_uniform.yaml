transit:
  t0: 0.0 # time of inferior conjunction
  per: 4.055259 # orbital period in days
  rp: 0.1399 # planet radius (in units of stellar radii)
  a: 11.056 # semi-major axis (in units of stellar radii)
  inc: 87.73 # orbital inclination (in degrees)
  ecc: 0.0 # eccentricity
  w: 90.0 # longitude of periastron (in degrees)
  u: [] # we are considering a uniform model
  limb_dark: "uniform" # limb darkening model
classifier:
  path: "data/tess_data.csv"
  n_bins: 1000
  samples_per_class: 350
  use_scaler: false
  random_state: 42
  rf:
    n_estimators: 500
    max_depth: 50       
    min_samples_leaf: 5
    max_features: "sqrt"
    bootstrap: true
    class_weight: balanced #no augumentation
    n_jobs: -1
    oob_score: true
  tree:
    max_depth: 1
    min_samples_split: 12
    min_samples_leaf: 20
    ccp_alpha: 0.01
    class_weight: balanced #no augumentation
  
  
